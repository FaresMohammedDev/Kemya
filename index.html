<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيمياء فلاش كاردز - مراجعة ذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #0ea5e9;
            --accent: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --btn-again: #ef4444;
            --btn-hard: #f97316;
            --btn-good: #22c55e;
            --btn-easy: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 30px 30px;
            background-color: #f0f4f8;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .home-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .home-btn:hover {
            color: var(--primary);
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
        }

        /* Decks View */
        #decks-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .deck-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e2e8f0;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .deck-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary);
        }

        .deck-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .deck-stats {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .stat-due { color: var(--btn-again); font-weight: 700; }
        .stat-new { color: var(--btn-easy); font-weight: 700; }

        /* Study View */
        #study-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            flex: 1;
        }

        .study-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 600px;
            min-height: 350px;
            flex: 1;
            margin-bottom: 2rem;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            position: relative;
            border: 2px solid #e2e8f0;
            transition: border-color 0.3s ease;
        }

        .flashcard.back-shown {
            border-color: var(--secondary);
        }

        .card-content {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-back-content {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px dashed #cbd5e1;
            width: 80%;
        }

        .card-back-text {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            direction: ltr; /* Important for chemical symbols */
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-show {
            background-color: var(--primary);
            width: 100%;
            max-width: 300px;
        }

        .btn-show:hover { background-color: var(--primary-dark); }

        .rating-btns {
            display: none;
            width: 100%;
            gap: 0.5rem;
        }

        .btn-rating {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.5rem;
        }

        .btn-again { background-color: var(--btn-again); }
        .btn-hard { background-color: var(--btn-hard); }
        .btn-good { background-color: var(--btn-good); }
        .btn-easy { background-color: var(--btn-easy); }

        .btn-rating:hover { filter: brightness(1.1); }

        .interval-text {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: 600;
        }

        .finished-message {
            display: none;
            text-align: center;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 3rem;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .finished-message h2 { color: var(--accent); }

        /* Icon styling */
        .chem-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 600px) {
            header { padding: 0.75rem 1rem; }
            .logo { font-size: 1.25rem; }
            main { padding: 1rem 0.5rem; }
            #decks-view { grid-template-columns: 1fr; gap: 0.75rem; }
            .flashcard-container { min-height: 250px; margin-bottom: 1rem; }
            .flashcard { padding: 1rem; }
            .card-content { font-size: 2rem; }
            .card-back-content { margin-top: 1rem; padding-top: 1rem; width: 90%; }
            .card-back-text { font-size: 2.5rem; }
            .rating-btns { flex-wrap: wrap; gap: 0.5rem; }
            .btn-rating { flex-basis: calc(50% - 0.25rem); padding: 0.5rem; }
            .btn { font-size: 0.9rem; }
            .interval-text { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>⚗️</span> ChemMind
        </div>
        <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
    </header>

    <main>
        <!-- Decks List View -->
        <div id="decks-view">
            <!-- Decks will be injected here via JS -->
        </div>

        <!-- Study View -->
        <div id="study-view">
            <div class="study-header">
                <span id="current-deck-name">اسم المجموعة</span>
                <span>الباقي: <span id="cards-remaining">0</span></span>
            </div>

            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="card-content" id="card-front">
                        <!-- Front content -->
                    </div>
                    <div class="card-back-content" id="card-back-container">
                        <div class="card-back-text" id="card-back">
                            <!-- Back content -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls" id="controls-show">
                <button class="btn btn-show" onclick="showAnswer()">إظهار الإجابة</button>
            </div>

            <div class="controls rating-btns" id="controls-rating">
                <button class="btn btn-rating btn-again" onclick="rateCard('again')">
                    <span>مجدداً</span>
                    <span class="interval-text">بعد كارتين</span>
                </button>
                <button class="btn btn-rating btn-hard" onclick="rateCard('hard')">
                    <span>صعب</span>
                    <span class="interval-text">بعد 5 كروت</span>
                </button>
                <button class="btn btn-rating btn-good" onclick="rateCard('good')">
                    <span>جيد</span>
                    <span class="interval-text">بعد 10 كروت</span>
                </button>
                <button class="btn btn-rating btn-easy" onclick="rateCard('easy')">
                    <span>سهل</span>
                    <span class="interval-text">تم الحفظ</span>
                </button>
            </div>
        </div>

        <!-- Finished Message -->
        <div id="finished-view" class="finished-message">
            <div class="chem-icon">🎉</div>
            <h2>أحسنت!</h2>
            <p>لقد أنهيت مراجعة هذه المجموعة في الوقت الحالي.</p>
            <button class="btn btn-show" onclick="goHome()">العودة للمجموعات</button>
        </div>
    </main>

    <script>
        // --- DATA ---
        const rawCards = [
            // الأيونات الموجبة (الكاتيونات)
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الليثيوم", back: "Li⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الصوديوم", back: "Na⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "البوتاسيوم", back: "K⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الفضة", back: "Ag⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الماغنيسيوم", back: "Mg²⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الكالسيوم", back: "Ca²⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الخارصين", back: "Zn²⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الباريوم", back: "Ba²⁺" },
            { deck: "الكاتيونات (الأيونات الموجبة)", front: "الألومنيوم", back: "Al³⁺" },

            // الأيونات السالبة (الأنيونات)
            { deck: "الأنيونات (الأيونات السالبة)", front: "الفلوريد", back: "F⁻" },
            { deck: "الأنيونات (الأيونات السالبة)", front: "الكلوريد", back: "Cl⁻" },
            { deck: "الأنيونات (الأيونات السالبة)", front: "البروميد", back: "Br⁻" },
            { deck: "الأنيونات (الأيونات السالبة)", front: "اليوديد", back: "I⁻" },
            { deck: "الأنيونات (الأيونات السالبة)", front: "الأكسيد", back: "O²⁻" },
            { deck: "الأنيونات (الأيونات السالبة)", front: "الكبريتيد", back: "S²⁻" },

            // مجموعات ذرية
            { deck: "مجموعات ذرية", front: "الهيدروكسيد", back: "OH⁻" },
            { deck: "مجموعات ذرية", front: "النترات", back: "NO₃⁻" },
            { deck: "مجموعات ذرية", front: "النيتريت", back: "NO₂⁻" },
            { deck: "مجموعات ذرية", front: "البيكربونات", back: "HCO₃⁻" },
            { deck: "مجموعات ذرية", front: "الكربونات", back: "CO₃²⁻" },
            { deck: "مجموعات ذرية", front: "الكبريتات", back: "SO₄²⁻" },
            { deck: "مجموعات ذرية", front: "الكبريتيت", back: "SO₃²⁻" },
            { deck: "مجموعات ذرية", front: "الفوسفات", back: "PO₄³⁻" },
            { deck: "مجموعات ذرية", front: "الأمونيوم", back: "NH₄⁺" },

            // العناصر
            { deck: "العناصر الشائعة", front: "الهيدروجين", back: "H" },
            { deck: "العناصر الشائعة", front: "الهيليوم", back: "He" },
            { deck: "العناصر الشائعة", front: "الزئبق", back: "Hg" },
            { deck: "العناصر الشائعة", front: "الأكسجين", back: "O" },
            { deck: "العناصر الشائعة", front: "الفلور", back: "F" },
            { deck: "العناصر الشائعة", front: "الحديد", back: "Fe" },
            { deck: "العناصر الشائعة", front: "الفوسفور", back: "P" },
            { deck: "العناصر الشائعة", front: "الرصاص", back: "Pb" },
            { deck: "العناصر الشائعة", front: "الكبريت", back: "S" },
            { deck: "العناصر الشائعة", front: "السيليكون", back: "Si" },
            { deck: "العناصر الشائعة", front: "البوتاسيوم", back: "K" },
            { deck: "العناصر الشائعة", front: "الماغنيسيوم", back: "Mg" },
            { deck: "العناصر الشائعة", front: "الليثيوم", back: "Li" },
            { deck: "العناصر الشائعة", front: "الخارصين (الزنك)", back: "Zn" },
            { deck: "العناصر الشائعة", front: "النيتروجين", back: "N" },
            { deck: "العناصر الشائعة", front: "النيون", back: "Ne" },
            { deck: "العناصر الشائعة", front: "الصوديوم", back: "Na" },
            { deck: "العناصر الشائعة", front: "البورون", back: "B" },
            { deck: "العناصر الشائعة", front: "البريليوم", back: "Be" },
            { deck: "العناصر الشائعة", front: "البروم", back: "Br" },
            { deck: "العناصر الشائعة", front: "اليود", back: "I" },
            { deck: "العناصر الشائعة", front: "الكربون", back: "C" },
            { deck: "العناصر الشائعة", front: "الكالسيوم", back: "Ca" },
            { deck: "العناصر الشائعة", front: "الكلور", back: "Cl" },
            { deck: "العناصر الشائعة", front: "النحاس", back: "Cu" },
            { deck: "العناصر الشائعة", front: "الكروم", back: "Cr" },
            { deck: "العناصر الشائعة", front: "الأرجون", back: "Ar" },
            { deck: "العناصر الشائعة", front: "الألومنيوم", back: "Al" },
            { deck: "العناصر الشائعة", front: "الذهب", back: "Au" },
            { deck: "العناصر الشائعة", front: "الفضة", back: "Ag" }
        ];

        // --- STATE & LOCAL STORAGE ---
        // Initialize cards with SRS properties if not in localStorage
        let myCards = JSON.parse(localStorage.getItem('chemCardsData'));

        if (!myCards || myCards.length !== rawCards.length) {
            myCards = rawCards.map((card, index) => ({
                id: index,
                ...card,
                dueDate: Date.now(), // Due immediately
                interval: 0, // In minutes. 0 means new
                reps: 0,
                ease: 2.5
            }));
            saveData();
        }

        function saveData() {
            localStorage.setItem('chemCardsData', JSON.stringify(myCards));
        }

        // --- LOGIC ---
        let currentDeck = "";
        let studyQueue = [];
        let currentCardIndex = 0; // Index in studyQueue

        const views = {
            decks: document.getElementById('decks-view'),
            study: document.getElementById('study-view'),
            finished: document.getElementById('finished-view')
        };

        function showView(viewName) {
            Object.values(views).forEach(v => v.style.display = 'none');
            views[viewName].style.display = viewName === 'decks' ? 'grid' : 'flex';
        }

        function goHome() {
            renderDecks();
            showView('decks');
        }

        function getDeckStats() {
            const stats = {};
            const now = Date.now();
            myCards.forEach(card => {
                if (!stats[card.deck]) {
                    stats[card.deck] = { total: 0, due: 0, new: 0 };
                }
                stats[card.deck].total++;
                if (card.reps === 0) {
                    stats[card.deck].new++;
                } else if (card.dueDate <= now) {
                    stats[card.deck].due++;
                }
            });
            return stats;
        }

        function renderDecks() {
            const decksContainer = document.getElementById('decks-view');
            decksContainer.innerHTML = '';
            
            const stats = getDeckStats();
            const deckNames = Object.keys(stats);

            deckNames.forEach(deckName => {
                const s = stats[deckName];
                const totalDue = s.due + s.new;

                const el = document.createElement('div');
                el.className = 'deck-card';
                el.onclick = () => startStudy(deckName);

                // Add nice icons based on name
                let icon = '🧪';
                if(deckName.includes('موجبة')) icon = '🔵';
                if(deckName.includes('سالبة')) icon = '🔴';
                if(deckName.includes('مجموعات')) icon = '🧬';

                el.innerHTML = `
                    <div class="chem-icon">${icon}</div>
                    <div class="deck-title">${deckName}</div>
                    <div class="deck-stats">
                        <span title="بطاقات جديدة" class="stat-new">${s.new} جديدة</span>
                        <span title="للمراجعة" class="stat-due">${s.due} مراجعة</span>
                    </div>
                    <div style="font-size: 0.8rem; color: #94a3b8; margin-top: auto;">
                        انقر للبدء
                    </div>
                `;
                decksContainer.appendChild(el);
            });
        }

        function startStudy(deckName) {
            currentDeck = deckName;
            const now = Date.now();
            
            // Get due cards (including new ones) and sort (due first)
            studyQueue = myCards.filter(c => c.deck === deckName && c.dueDate <= now);
            
            // Shuffle study queue for randomness
            studyQueue.sort(() => Math.random() - 0.5);

            document.getElementById('current-deck-name').textContent = deckName;
            
            if (studyQueue.length === 0) {
                showView('finished');
            } else {
                showView('study');
                loadNextCard();
            }
        }

        function loadNextCard() {
            if (studyQueue.length === 0) {
                showView('finished');
                return;
            }

            const card = studyQueue[0];
            
            // Update UI
            document.getElementById('cards-remaining').textContent = studyQueue.length;
            document.getElementById('card-front').textContent = card.front;
            document.getElementById('card-back').textContent = card.back;
            
            // Reset state
            document.getElementById('card-back-container').style.display = 'none';
            document.getElementById('controls-show').style.display = 'flex';
            document.getElementById('controls-rating').style.display = 'none';
            document.getElementById('flashcard').classList.remove('back-shown');

        }

        function showAnswer() {
            document.getElementById('card-back-container').style.display = 'flex';
            document.getElementById('controls-show').style.display = 'none';
            document.getElementById('controls-rating').style.display = 'flex';
            document.getElementById('flashcard').classList.add('back-shown');
        }

        function rateCard(rating) {
            const card = studyQueue.shift(); // Remove from front of queue
            
            let offset = -1;

            if (rating === 'again') {
                offset = 2;
            } else if (rating === 'hard') {
                offset = 5;
            } else if (rating === 'good') {
                offset = 10;
            } else if (rating === 'easy') {
                offset = -1; // Done
            }

            if (offset !== -1) {
                // Re-insert into queue
                let insertIndex = Math.min(offset, studyQueue.length);
                studyQueue.splice(insertIndex, 0, card);
            } else {
                // Mark as completed in localStorage so it doesn't show immediately next session
                card.dueDate = Date.now() + (24 * 60 * 60 * 1000); // Due in 1 day
                card.reps = 1;
                const mainIndex = myCards.findIndex(c => c.id === card.id);
                if (mainIndex > -1) {
                    myCards[mainIndex] = card;
                    saveData();
                }
            }

            loadNextCard();
        }

        // Init
        goHome();

    </script>
</body>
</html>
