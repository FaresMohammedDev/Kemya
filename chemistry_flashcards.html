<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلاش كاردز الكيمياء</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .tabs {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #e0e5ec;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: #3498db;
            color: white;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* تصميم الفلاش كارد */
        .card {
            background-color: transparent;
            width: 100%;
            height: 150px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 15px;
        }

        .card-front {
            background-color: #ffffff;
            color: #2c3e50;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #ecf0f1;
        }

        .card-back {
            background-color: #2c3e50;
            color: white;
            transform: rotateY(180deg);
            font-size: 28px;
            font-weight: bold;
            direction: ltr; /* لضبط الرموز الإنجليزية */
        }

        .card-back span.desc {
            font-size: 14px;
            font-weight: normal;
            margin-top: 10px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مفتاح حفظ الكيمياء 🧪</h1>
        
        <!-- أزرار الفلترة -->
        <div class="tabs">
            <button class="tab-btn active" data-filter="all">الكل</button>
            <button class="tab-btn" data-filter="easy">عناصر بديهية</button>
            <button class="tab-btn" data-filter="tricky">عناصر غدارة</button>
            <button class="tab-btn" data-filter="valency1">أحادي التكافؤ</button>
            <button class="tab-btn" data-filter="valency2">ثنائي التكافؤ</button>
            <button class="tab-btn" data-filter="valency3">ثلاثي التكافؤ</button>
        </div>

        <!-- حاوية الكروت -->
        <div class="cards-grid" id="cardsContainer">
            <!-- الكروت هتتولد هنا عن طريق الجافاسكريبت -->
        </div>
    </div>
    <script>
        const elementsData = [
            // العناصر البديهية
            { name: "هيدروجين", symbol: "H", category: "easy", desc: "أول حرف" },
            { name: "أكسجين", symbol: "O", category: "easy", desc: "أول حرف" },
            { name: "كربون", symbol: "C", category: "easy", desc: "أول حرف" },
            { name: "كالسيوم", symbol: "Ca", category: "easy", desc: "أول حرفين" },
            
            // العناصر الغدارة
            { name: "صوديوم", symbol: "Na", category: "tricky", desc: "غدار (لاتيني)" },
            { name: "بوتاسيوم", symbol: "K", category: "tricky", desc: "غدار (لاتيني)" },
            { name: "حديد", symbol: "Fe", category: "tricky", desc: "غدار (لاتيني)" },
            { name: "نحاس", symbol: "Cu", category: "tricky", desc: "غدار (لاتيني)" },

            // التكافؤات الأحادية
            { name: "ليثيوم", symbol: "Li<sup>+</sup>", category: "valency1", desc: "أحادي موجب" },
            { name: "أمونيوم", symbol: "NH<sub>4</sub><sup>+</sup>", category: "valency1", desc: "مجموعة أحادية موجبة" },
            { name: "كلوريد", symbol: "Cl<sup>-</sup>", category: "valency1", desc: "أحادي سالب" },
            { name: "هيدروكسيد", symbol: "OH<sup>-</sup>", category: "valency1", desc: "مجموعة أحادية سالبة" },

            // التكافؤات الثنائية
            { name: "ماغنسيوم", symbol: "Mg<sup>2+</sup>", category: "valency2", desc: "ثنائي موجب" },
            { name: "أكسيد", symbol: "O<sup>2-</sup>", category: "valency2", desc: "ثنائي سالب" },
            { name: "كربونات", symbol: "CO<sub>3</sub><sup>2-</sup>", category: "valency2", desc: "مجموعة ثنائية سالبة" },
            { name: "كبريتات", symbol: "SO<sub>4</sub><sup>2-</sup>", category: "valency2", desc: "مجموعة ثنائية سالبة" },

            // التكافؤات الثلاثية
            { name: "ألومنيوم", symbol: "Al<sup>3+</sup>", category: "valency3", desc: "ثلاثي موجب" },
            { name: "فوسفات", symbol: "PO<sub>4</sub><sup>3-</sup>", category: "valency3", desc: "مجموعة ثلاثية سالبة" }
        ];

        const container = document.getElementById('cardsContainer');
        const tabs = document.querySelectorAll('.tab-btn');

        function renderCards(filter) {
            container.innerHTML = '';
            
            const filteredData = filter === 'all' 
                ? elementsData 
                : elementsData.filter(item => item.category === filter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            ${item.name}
                        </div>
                        <div class="card-back">
                            <div>${item.symbol}</div>
                            <span class="desc">${item.desc}</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                });

                container.appendChild(card);
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderCards(tab.dataset.filter);
            });
        });

        renderCards('all');
    </script>
</body>
</html>
